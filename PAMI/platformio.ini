; Firmware PAMI 2027 — un environnement par PAMI.
;   pio run -e pami3 -t upload     (compile + flashe le PAMI n°3)
;   pio device monitor             (console série, tapez "help")

[platformio]
default_envs = pami1

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Bibliothèques externes copiées dans lib/ (aucun téléchargement) :
;   lib/FastAccelStepper  v1.2.8 (MIT) - https://github.com/gin66/FastAccelStepper
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:pami1]
build_flags = ${env.build_flags} -DPAMI_ID=1

[env:pami2]
build_flags = ${env.build_flags} -DPAMI_ID=2

[env:pami3]
build_flags = ${env.build_flags} -DPAMI_ID=3

[env:pami4]
build_flags = ${env.build_flags} -DPAMI_ID=4

[env:pami5]
build_flags = ${env.build_flags} -DPAMI_ID=5

[env:pami6]
build_flags = ${env.build_flags} -DPAMI_ID=6
